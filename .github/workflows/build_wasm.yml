name: Build (Linux/Emscripten)
on:
  workflow_call:

jobs:
  build-lin-emsdk:
    runs-on: ubuntu-24.04
    steps:
    - name: Clone Tree
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        path: occt.git
    - name: Clone Tcl
      uses: actions/checkout@v6
      with:
        repository: gkv311/tcl
        ref: 'core-8-6-11-wasm'
        path: tcl.git
        fetch-depth: 1
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          g++ cmake ninja-build
    - name: Setup emsdk
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 4.0.5
        actions-cache-folder: 'emsdk-cache'
        no-cache: true
    - name: Build Tcl
      run: |
        emcc -v
        aNbJobs="$(getconf _NPROCESSORS_ONLN)"
        mkdir -p "build"
        aTcl="$PWD/build/tcl-wasm"
        aTclMake="$PWD/build/tcl-make"
        cp -r -f "./tcl.git" "$aTclMake"
        pushd "$aTclMake/unix"
        emconfigure ./configure --host wasm32 --prefix=$aTcl --enable-shared=no --enable-threads=no
        emmake make -j$aNbJobs
        emmake make install
        popd
        cp "${aTcl}/lib/libtcl8.6.a" "${aTcl}/lib/libtcl.a"
    - name: Configure project
      env:
        CMAKE_C_FLAGS: -Werror
      run: |
        emcc -v
        mkdir -p "build"
        aTcl="$PWD/build/tcl-wasm"
        cmake -G Ninja -S ./occt.git -B "./build/occt-make" \
          -D CMAKE_TOOLCHAIN_FILE:FILEPATH="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
          -D CMAKE_BUILD_TYPE="Release" \
          -D BUILD_LIBRARY_TYPE:STRING="Static" \
          -D CMAKE_C_FLAGS:STRING="$CMAKE_C_FLAGS" \
          -D CMAKE_CXX_FLAGS:STRING="$CMAKE_C_FLAGS" \
          -D INSTALL_DIR:PATH=$PWD/build/install \
          -D BUILD_RELEASE_DISABLE_EXCEPTIONS:BOOL=OFF \
          -D BUILD_DOC_Overview:BOOL=OFF \
          -D BUILD_Inspector:BOOL=OFF \
          -D BUILD_MODULE_Draw:BOOL=ON \
          -D USE_FREETYPE:BOOL=OFF \
          -D USE_FREEIMAGE:BOOL=OFF \
          -D USE_TK:BOOL=OFF \
          -D 3RDPARTY_TCL_DIR:PATH="${aTcl}" \
          -D 3RDPARTY_TCL_INCLUDE_DIR:PATH="${aTcl}/include" \
          -D 3RDPARTY_TCL_LIBRARY_DIR:PATH="${aTcl}/lib" \
          -D 3RDPARTY_TCL_LIBRARY:FILEPATH="${aTcl}/lib/libtcl.a"
    - name: Build project
      run: |
        cmake --build "./build/occt-make" --config Release
    - name: Install build
      run: |
        cmake --build "./build/occt-make" --config Release --target install
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: occt-draw-wasm32
        path: build/install/bin
