name: Build (macOS/Clang)
on:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
    - name: Runner info
      run: |
        sysctl -a | grep brand
    - name: Clone Tree
      uses: actions/checkout@v6
      with:
        path: occt.git
        fetch-depth: 1
    # FreeType is preinstalled from Brew in image
    #- name: Install Dependencies
    #  run: |
    #    brew update
    #    brew install \
    #      freetype freeimage
    - name: Configure project
      env:
        OCCT_CONFIG: |
          set(BUILD_RELEASE_DISABLE_EXCEPTIONS OFF CACHE BOOL "")
          set(BUILD_DOC_Overview OFF CACHE BOOL "")
          set(BUILD_MODULE_Draw  ON CACHE BOOL "")
          # disable Tk as it is broken since macOS 15+
          set(USE_TK            OFF CACHE BOOL "")
          set(USE_FREETYPE       ON CACHE BOOL "")
          set(USE_FREEIMAGE     OFF CACHE BOOL "")
          set(USE_LIBPNG         ON CACHE BOOL "")
          set(CMAKE_OSX_DEPLOYMENT    "10.10")
          set(CMAKE_OSX_ARCHITECTURES "${{ matrix.arch }}")
          set(CMAKE_BUILD_TYPE "Release")
          set(CMAKE_C_FLAGS    "-Werror")
          set(CMAKE_CXX_FLAGS  "-Werror")
          set(INSTALL_DIR      "${CMAKE_CURRENT_LIST_DIR}/occt-install" CACHE PATH "")
      run: |
        BREW_PREFIX="$(brew --prefix)"
        echo "BREW_PREFIX=$BREW_PREFIX"
        echo "${OCCT_CONFIG}" | tee ./occt-make.cmake
        cmake -S ./occt.git -B ./occt-make -G Ninja --toolchain "$PWD/occt-make.cmake" \
          -D FREETYPE_DIR="$BREW_PREFIX" \
          -D FREEIMAGE_DIR="$BREW_PREFIX"
    - name: Build project
      run: |
        cmake --build ./occt-make
    - name: Install build
      run: |
        cmake --install ./occt-make --prefix ./occt-install
    - name: Run DRAW
      id: draw
      run: |
        export DYLD_LIBRARY_PATH=$PWD/occt-install/lib
        export PATH=$PWD/occt-install/bin:$PATH
        echo "::group::Draw Harness info"
        DRAWEXE -b -c "dversion"
        echo "::endgroup::"
        echo ""
        echo "::group::Load ALL plugins"
        DRAWEXE -b -c "pload ALL"
        echo "::endgroup::"
        echo ""
        echo "::group::Load 3D Viewer (OpenGL Compatible Profile)"
        DRAWEXE -v -c "pload VISUALIZATION; vdriver -load GL; vinit; vglinfo;"
        echo "::endgroup::"
        echo ""
        echo "::group::Load 3D Viewer (OpenGL Core Profile)"
        DRAWEXE -v -c "pload VISUALIZATION; vdriver -load GL; vcaps -core; vinit; vglinfo;"
        echo "::endgroup::"
        echo ""
        echo "Run basic tests"
        export CASROOT=$PWD/occt.git
        export CSF_OCCTTestsPath=$CASROOT/tests
        DRAWEXE -c "testgrid collections,bugs n,fclasses -outdir ./occt-results"
        testslog=./occt-results/tests.log
        nb_ok=`grep -o --count ': OK' $testslog || echo -n`
        nb_bad=`grep -o --count ': BAD' $testslog || echo -n`
        nb_failed=`grep -o --count ': FAILED' $testslog || echo -n`
        nb_skipped=`grep -o --count ': SKIPPED' $testslog || echo -n`
        nb_improved=`grep -o --count ': IMPROVED' $testslog || echo -n`
        echo "nb_failed=$nb_failed" >> $GITHUB_OUTPUT
        if [[ $nb_failed != '0' ]]; then
          # find lines with failed cases, trim leading spaces, replace newlines into comma
          if [[ $nb_skipped != '0' ]]; then
            list_failed=`sed '/^Failed/,/^Skipped/!d;//d' $testslog | sed 's/^ *//g' | sed 's/^\|$/"/g'|paste -sd, -`
          else
            list_failed=`sed '/^Failed/,/^Total cases/!d;//d' $testslog | sed 's/^ *//g' | sed 's/^\|$/"/g'|paste -sd, -`
          fi
          echo "::warning:: $nb_failed FAILED test(s) ($list_failed). Please check regressions."
        elif [[ $nb_improved != '0' ]]; then
          echo "::warning:: $nb_improved IMPROVED test(s). Please validate results."
        elif [[ $nb_ok == '0' ]]; then
          echo "::error:: Invalid test results. Please check test grids."
        fi
    - name: Upload report with failed tests
      if: (steps.draw.outputs.nb_failed != '0')
      uses: actions/upload-artifact@v6
      with:
        name: occt-macos-${{ matrix.arch }}-tests
        path: occt-results
        if-no-files-found: error
