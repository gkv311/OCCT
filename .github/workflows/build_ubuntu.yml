name: Build (Ubuntu/GCC+Clang)
on:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
        compiler: [gcc, clang]
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
    - name: Runner info
      run: |
        lscpu
    - name: Clone Tree
      uses: actions/checkout@v6
      with:
        path: occt.git
        fetch-depth: 1
    - name: Configure environment
      id: cfg
      run: |
        if [ "${{ matrix.compiler }}" == "gcc" ]; then
          echo "CC=gcc" >> $GITHUB_OUTPUT
          echo "CXX=g++" >> $GITHUB_OUTPUT
          echo "BUILD_SAMPLES_QT=ON" >> $GITHUB_OUTPUT
          echo "BUILD_Inspector=ON" >> $GITHUB_OUTPUT
        elif [ "${{ matrix.compiler }}" == "clang" ]; then
          echo "CC=clang" >> $GITHUB_OUTPUT
          echo "CXX=clang++" >> $GITHUB_OUTPUT
          echo "BUILD_SAMPLES_QT=OFF" >> $GITHUB_OUTPUT
          echo "BUILD_Inspector=OFF" >> $GITHUB_OUTPUT
        fi
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ${{ matrix.compiler }} cmake ninja-build \
          libfontconfig-dev libfreetype-dev \
          rapidjson-dev libdraco-dev \
          libx11-dev \
          libwayland-dev \
          libfreeimage-dev \
          libgl-dev libegl-dev libgles2-mesa-dev \
          tcllib tklib tcl-dev tk-dev \
          libavcodec-dev libavdevice-dev libavformat-dev libavutil-dev libswscale-dev \
          qtbase5-dev qtdeclarative5-dev qttools5-dev qttools5-dev-tools \
          qml-module-qtquick-controls2 qml-module-qtquick-templates2 \
          xvfb
    - name: Configure project
      env:
        CC: /usr/bin/${{ steps.cfg.outputs.CC }}
        CXX: /usr/bin/${{ steps.cfg.outputs.CXX }}
        OCCT_CONFIG: |
          set(BUILD_RELEASE_DISABLE_EXCEPTIONS OFF CACHE BOOL "")
          set(BUILD_DOC_Overview OFF CACHE BOOL "")
          set(BUILD_MODULE_Draw  ON CACHE BOOL "")
          set(BUILD_SAMPLES_QT ${{ steps.cfg.outputs.BUILD_SAMPLES_QT }} CACHE BOOL "")
          set(BUILD_Inspector ${{ steps.cfg.outputs.BUILD_Inspector }} CACHE BOOL "")
          set(USE_FREETYPE       ON CACHE BOOL "")
          set(USE_FREEIMAGE      ON CACHE BOOL "")
          set(USE_FFMPEG         ON CACHE BOOL "")
          set(USE_XLIB           ON CACHE BOOL "")
          set(USE_WAYLAND        ON CACHE BOOL "")
          set(USE_GLES2          ON CACHE BOOL "")
          set(USE_RAPIDJSON      ON CACHE BOOL "")
          set(USE_DRACO          ON CACHE BOOL "")
          set(CMAKE_BUILD_TYPE "Release")
          set(CMAKE_C_FLAGS    "-Werror")
          set(CMAKE_CXX_FLAGS  "-Werror -DQT_NO_DEPRECATED_WARNINGS")
          set(INSTALL_DIR      "${CMAKE_CURRENT_LIST_DIR}/occt-install" CACHE PATH "")
          set(3RDPARTY_QT_DIR  "/usr" CACHE PATH "")
      run: |
        ${{ matrix.compiler }} --version
        echo "${OCCT_CONFIG}" | tee ./occt-make.cmake
        cmake -S ./occt.git -B ./occt-make -G Ninja --toolchain "$PWD/occt-make.cmake"
    - name: Build project
      run: |
        cmake --build ./occt-make
    - name: Install build
      run: |
        cmake --install ./occt-make --prefix ./occt-install
    - name: Run DRAW
      id: draw
      run: |
        export LD_LIBRARY_PATH=$PWD/occt-install/lib
        export PATH=$PWD/occt-install/bin:$PATH
        echo "::group::Draw Harness info"
        xvfb-run -a DRAWEXE -c "dversion"
        echo "::endgroup::"
        echo ""
        echo "::group::Load ALL plugins"
        xvfb-run -a DRAWEXE -c "pload ALL"
        echo "::endgroup::"
        echo ""
        echo "::group::Load 3D Viewer (TKOpenGl)"
        xvfb-run -a DRAWEXE -c "pload VISUALIZATION; vdriver -load GL;   vinit; vglinfo;"
        echo "::endgroup::"
        echo ""
        echo "::group::Load 3D Viewer (TKOpenGles)"
        xvfb-run -a DRAWEXE -c "pload VISUALIZATION; vdriver -load GLES; vinit; vglinfo;"
        echo "::endgroup::"
        echo ""
        echo "Run basic tests"
        export CASROOT=$PWD/occt.git
        export CSF_OCCTTestsPath=$CASROOT/tests
        xvfb-run -a DRAWEXE -c "testgrid collections,bugs n,fclasses -outdir ./occt-results"
        testslog=./occt-results/tests.log
        nb_ok=`grep -o --count ': OK' $testslog || echo -n`
        nb_bad=`grep -o --count ': BAD' $testslog || echo -n`
        nb_failed=`grep -o --count ': FAILED' $testslog || echo -n`
        nb_skipped=`grep -o --count ': SKIPPED' $testslog || echo -n`
        nb_improved=`grep -o --count ': IMPROVED' $testslog || echo -n`
        echo "nb_failed=$nb_failed" >> $GITHUB_OUTPUT
        if [[ $nb_failed != '0' ]]; then
          # find lines with failed cases, trim leading spaces, replace newlines into comma
          if [[ $nb_skipped != '0' ]]; then
            list_failed=`sed '/^Failed/,/^Skipped/!d;//d' $testslog | sed 's/^ *//g' | sed 's/^\|$/"/g'|paste -sd, -`
          else
            list_failed=`sed '/^Failed/,/^Total cases/!d;//d' $testslog | sed 's/^ *//g' | sed 's/^\|$/"/g'|paste -sd, -`
          fi
          echo "::warning:: $nb_failed FAILED test(s) ($list_failed). Please check regressions."
        elif [[ $nb_improved != '0' ]]; then
          echo "::warning:: $nb_improved IMPROVED test(s). Please validate results."
        elif [[ $nb_ok == '0' ]]; then
          echo "::error:: Invalid test results. Please check test grids."
        fi
    - name: Upload report with failed tests
      if: (steps.draw.outputs.nb_failed != '0')
      uses: actions/upload-artifact@v6
      with:
        name: occt-ubuntu-${{ matrix.arch }}-${{ matrix.compiler }}-tests
        path: occt-results
        if-no-files-found: error

  checkascii:
    runs-on: ubuntu-24.04
    steps:
    - name: Clone Tree
      uses: actions/checkout@v6
      with:
        path: occt.git
        fetch-depth: 1
    - name: Check non-ASCII symbols
      run: |
        pushd ./occt.git
        if grep -P '[^\x00-\x7f]' --exclude=./src/Wayland/*.pxx ./src/*/*.*xx; then
          echo "Error: there are non-ASCII symbols found in source code"
          exit 1
        fi
        popd

  genres:
    runs-on: ubuntu-24.04
    steps:
    - name: Clone Tree
      uses: actions/checkout@v6
      with:
        path: occt.git
        fetch-depth: 1
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          g++ cmake ninja-build \
          flex bison libfl-dev \
          libwayland-dev wayland-protocols \
          xvfb
    - name: Configure project
      env:
        OCCT_CONFIG: |
          set(BUILD_RESOURCES    ON  CACHE BOOL "")
          set(BUILD_YACCLEX      ON  CACHE BOOL "")
          set(BUILD_DOC_Overview OFF CACHE BOOL "")
          set(BUILD_MODULE_Draw  OFF CACHE BOOL "")
          set(USE_FREETYPE       OFF CACHE BOOL "")
          set(USE_FREEIMAGE      OFF CACHE BOOL "")
          set(USE_XLIB           OFF CACHE BOOL "")
          set(USE_WAYLAND        ON CACHE BOOL "")
          set(USE_GLES2          OFF CACHE BOOL "")
          set(CMAKE_BUILD_TYPE  "Release")
      run: |
        echo "${OCCT_CONFIG}" | tee ./occt-make.cmake
        cmake -S ./occt.git -B ./occt-make --toolchain "$PWD/occt-make.cmake"
    - name: Regenerete yacclex resources
      run: |
        cmake --build ./occt-make --target yacclex
    - name: Generate diff
      run: |
        pushd ./occt.git
        nbChanged=`git diff --numstat -- src/ | wc -l`
        if [ "$nbChanged" != 0 ]; then
          echo "Error: regenerated source code files are different:"
          git diff --numstat -- src/ | awk '{print $3}'
          git diff > ../occt_genres_diff.patch
        fi
        popd
    - name: Upload diff
      uses: actions/upload-artifact@v6
      with:
        name: occt_genres_diff.patch
        path: occt_genres_diff.patch
        if-no-files-found: ignore
    - name: Check results
      run: |
        pushd ./occt.git
        nbChanged=`git diff --numstat -- src/ | wc -l`
        popd
        if [ "$nbChanged" != 0 ]; then
          echo "Error: regenerated source code files are different, see occt_genres_diff.patch."
          exit 1
        fi
